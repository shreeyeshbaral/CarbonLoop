<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Shadow for elevation -->
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Forest Green Squircle Background -->
  <rect width="512" height="512" rx="112" fill="#176B3A" />

  <g filter="url(#soft-shadow)">
    <!-- Circular Loop Arrows & Leaf Emblem in Warm Off-White -->
    <!-- Top Arc & Arrow -->
    <path d="M 180 210 C 180 150, 310 130, 345 180" fill="none" stroke="#FFFDF8" stroke-width="26" stroke-linecap="round" />
    <path d="M 315 160 L 355 180 L 315 200" fill="none" stroke="#FFFDF8" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Bottom Arc & Arrow -->
    <path d="M 332 270 C 332 330, 202 350, 167 300" fill="none" stroke="#FFFDF8" stroke-width="26" stroke-linecap="round" />
    <path d="M 197 320 L 157 300 L 197 280" fill="none" stroke="#FFFDF8" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Center Eco Leaf -->
    <path d="M 230 255 C 230 205, 290 200, 295 200 C 295 255, 240 265, 230 255 Z" fill="#FFFDF8" />
    <path d="M 235 250 C 255 240, 280 215, 290 205" fill="none" stroke="#176B3A" stroke-width="5" stroke-linecap="round" />
  </g>

  <!-- Brand Typography: carbonloop -->
  <text x="256" y="415" text-anchor="middle" font-family="Montserrat, -apple-system, sans-serif" font-size="52" font-weight="700" fill="#FFFDF8" letter-spacing="-1">carbonloop</text>
</svg>
